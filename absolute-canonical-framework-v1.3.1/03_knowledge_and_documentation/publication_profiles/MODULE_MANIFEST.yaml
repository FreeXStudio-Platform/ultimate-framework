- ABS.MODULE.CONTROL.DECISIONS
- ABS.MODULE.CONTROL.RELEASE
- ABS.MODULE.CONTROL.STATE
- ABS.MODULE.CONTROL.WORK
- ABS.MODULE.KERNEL.AUTHORITY_TRUTH
