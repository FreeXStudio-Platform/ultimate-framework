module_id: ABS.MODULE.KNOWLEDGE.GRAPH
name: Registries, graph, indexes, context packs, and retrieval
version: 1.0.0
schema_version: 1.0.0
framework_release: 1.3.1
status: CANDIDATE
purpose: Registries, graph, indexes, context packs, and retrieval
scope:
  includes:
  - The framework shall define versioned registries and a source-controlled typed graph connecting sources, concepts,
    modules, requirements, claims, decisions, capabilities, artifacts, tests, evidence, profiles, and releases.
  - Graph edges shall record source, target, type, direction, evidence, confidence, lifecycle, and last verified
    identity, and required provenance/impact queries shall be testable.
  - Context packs shall be compact evidence-linked navigation aids and shall never outrank canonical sources; vector
    or graph-database infrastructure remains threshold-triggered.
  excludes: &id001
  - provider-specific authority unless this is an adapter
  - raw secrets or hidden credentials
  - completion claims without exact evidence
  - direct editing of generated derivatives
responsibilities:
- identify the canonical scope and source evidence
- define or update the narrative meaning
- update applicable machine, blueprint, visual, integration, and test forms
- run parity, link, security, and evidence checks
- publish only governed derivatives and invalidate them on source change
non_responsibilities: *id001
