module_id: ABS.MODULE.CONTROL.DECISIONS
name: Decision, risk, assumption, unknown, and waiver control
version: 1.0.0
schema_version: 1.0.0
framework_release: 1.3.1
status: CANDIDATE
purpose: Decision, risk, assumption, unknown, and waiver control
scope:
  includes:
  - Material decisions, assumptions, risks, unknowns, exceptions, and waivers shall have stable IDs, owners, evidence,
    impact, status, review triggers, and expiry where applicable.
  - Owner input shall be requested only for material legal/commercial authority, credentials, recurring cost, broad
    permissions, external publication, destructive action, or irreversible architecture that cannot be derived safely.
  - Unknown or contradictory evidence shall remain visible and shall block only the affected scope unless propagation
    is proven.
  excludes: &id001
  - provider-specific authority unless this is an adapter
  - raw secrets or hidden credentials
  - completion claims without exact evidence
  - direct editing of generated derivatives
responsibilities:
- read the latest durable state and version
- validate bounded input, authority, permission, dependency, and rollback
- apply one atomic update
- record checks, findings, evidence, and limitations
- persist exact next action and reject stale writes
non_responsibilities: *id001
