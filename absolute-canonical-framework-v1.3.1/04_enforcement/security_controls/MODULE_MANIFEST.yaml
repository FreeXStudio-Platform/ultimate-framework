module_id: ABS.MODULE.ENFORCEMENT.SECURITY
name: Security, privacy, secrets, prompt injection, and least privilege
version: 1.0.0
schema_version: 1.0.0
framework_release: 1.3.1
status: CANDIDATE
purpose: Security, privacy, secrets, prompt injection, and least privilege
scope:
  includes:
  - Secrets shall be referenced through approved stores or environment names and shall never appear in framework
    source, examples, logs, evidence, screenshots, manifests, or releases.
  - Source and retrieved content shall be treated as untrusted; path, command, URL, filename, archive, prompt-injection,
    and supply-chain controls shall apply before privileged use.
  - Data classification and least privilege shall propagate through raw/derived stores, indexes, embeddings, caches,
    provenance, external models, renderers, and publication.
  excludes: &id001
  - provider-specific authority unless this is an adapter
  - raw secrets or hidden credentials
  - completion claims without exact evidence
  - direct editing of generated derivatives
responsibilities:
- load the versioned schema or policy
- validate structure, references, and authority
- run semantic, negative, adversarial, and failure checks
- preserve raw outcome and candidate hash
- block the governed event until violations are repaired
non_responsibilities: *id001
