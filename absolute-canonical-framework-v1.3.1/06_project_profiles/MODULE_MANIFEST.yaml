module_id: ABS.MODULE.PROFILES.PROJECT
name: Minimal, standard, enterprise, and downstream profiles
version: 1.0.0
schema_version: 1.0.0
framework_release: 1.3.1
status: CANDIDATE
purpose: Minimal, standard, enterprise, and downstream profiles
scope:
  includes:
  - Minimal, standard, and enterprise profiles shall select bounded module, assurance, documentation, capability,
    and operational requirements without changing kernel invariants.
  - A project profile shall declare purpose, applicability, required/optional modules, capabilities, permissions,
    data classification, gates, installation, validation, migration, and uninstall/rollback.
  - Profiles shall be composable only through explicit precedence and compatibility checks and shall not import
    Builder Program history.
  excludes: &id001
  - provider-specific authority unless this is an adapter
  - raw secrets or hidden credentials
  - completion claims without exact evidence
  - direct editing of generated derivatives
responsibilities:
- classify project scale, domain, risk, and assurance
- select the smallest sufficient module composition
- apply only stricter policy overlays
- install in shadow mode with rollback
- validate project and adapter conformance before activation
non_responsibilities: *id001
