module_id: ABS.MODULE.CONTROL.STATE
name: Canonical project state and atomic updates
version: 1.0.0
schema_version: 1.0.0
framework_release: 1.3.1
status: CANDIDATE
purpose: Canonical project state and atomic updates
scope:
  includes:
  - Canonical project state shall be schema-validated, versioned, atomically written, conflict-aware, and accompanied
    by an append-only change journal.
  - State records shall identify project, framework/profile version, active objective, lifecycle, baseline hashes,
    permissions, health, and exact next action.
  - Concurrent actors shall use revision or compare-and-swap controls and may not silently overwrite authoritative
    state.
  excludes: &id001
  - provider-specific authority unless this is an adapter
  - raw secrets or hidden credentials
  - completion claims without exact evidence
  - direct editing of generated derivatives
responsibilities:
- read the latest durable state and version
- validate bounded input, authority, permission, dependency, and rollback
- apply one atomic update
- record checks, findings, evidence, and limitations
- persist exact next action and reject stale writes
non_responsibilities: *id001
owned_concepts:
- ABS.CONCEPT.PROJECT_STATE
requirements:
- ABS.REQ.PROJECT_STATE.001
- ABS.REQ.PROJECT_STATE.002
- ABS.REQ.PROJECT_STATE.003
provided_interfaces:
- ABS.IFACE.STATE.ATOMIC_UPDATE
consumed_interfaces:
