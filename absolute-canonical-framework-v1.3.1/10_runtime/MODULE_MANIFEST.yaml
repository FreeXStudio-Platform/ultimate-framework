module_id: ABS.MODULE.RUNTIME.EXECUTOR
name: Runtime execution, rail enforcement, and source-of-truth stamping
version: 1.0.0
schema_version: 1.0.0
framework_release: 1.3.1
status: CANDIDATE
purpose: Runtime execution, rail enforcement, and source-of-truth stamping
scope:
  includes:
  - The runtime shall permit exactly one next action at any project state, and shall refuse any command whose rail
    step is not that action, naming both the refusing rule and the permitted action.
  - Every governed mutation shall be written to the append-only hash-chained source of truth before project state
    is updated, so that no state can exist without a prior record of the action that produced it.
  - The runtime shall bind every evidence record, gate decision, document seal, and verification result to the exact
    tree identity it was computed against, and shall treat any record bound to a superseded identity as stale.
  excludes: &id001
  - provider-specific authority unless this is an adapter
  - raw secrets or hidden credentials
  - completion claims without exact evidence
  - direct editing of generated derivatives
  - any certification claim about an artifact this runtime produced
responsibilities:
- reconstruct project state from files only
- authorize each command against the rail or refuse it with the permitted action
- write artifact, then ledger entry, then state
- bind every observation to the exact tree identity
- invalidate dependent claims when the identity changes
non_responsibilities: *id001
owned_concepts:
- ABS.CONCEPT.RUNTIME_EXECUTION
