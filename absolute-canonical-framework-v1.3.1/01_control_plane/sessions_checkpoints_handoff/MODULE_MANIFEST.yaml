module_id: ABS.MODULE.CONTROL.SESSIONS
name: Sessions, checkpoints, context, and handoff
version: 1.0.0
schema_version: 1.0.0
framework_release: 1.3.1
status: CANDIDATE
purpose: Sessions, checkpoints, context, and handoff
scope:
  includes:
  - Sessions shall load durable program/project state, active work packet, relevant context pack, baseline hashes,
    capability health, and rollback before changes.
  - Session close shall persist changed files, checks, failures, findings, state revisions, checkpoint, exact next
    packet, and a transcript-independent handoff.
  - Context limits or provider interruption shall trigger checkpoint-and-resume rather than lower truth, safety,
    or completion standards.
  excludes: &id001
  - provider-specific authority unless this is an adapter
  - raw secrets or hidden credentials
  - completion claims without exact evidence
  - direct editing of generated derivatives
responsibilities:
- read the latest durable state and version
- validate bounded input, authority, permission, dependency, and rollback
- apply one atomic update
- record checks, findings, evidence, and limitations
- persist exact next action and reject stale writes
non_responsibilities: *id001
owned_concepts:
- ABS.CONCEPT.SESSIONS_HANDOFF
requirements:
- ABS.REQ.SESSIONS_HANDOFF.001
- ABS.REQ.SESSIONS_HANDOFF.002
- ABS.REQ.SESSIONS_HANDOFF.003
provided_interfaces:
- ABS.IFACE.SESSION.HANDOFF
consumed_interfaces:
