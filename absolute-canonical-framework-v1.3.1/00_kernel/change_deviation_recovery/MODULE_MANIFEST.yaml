module_id: ABS.MODULE.KERNEL.CHANGE_RECOVERY
name: Change, deviation, recovery, and rollback
version: 1.0.0
schema_version: 1.0.0
framework_release: 1.3.1
status: CANDIDATE
purpose: Change, deviation, recovery, and rollback
scope:
  includes:
  - Material changes shall have an impact set, checkpoint, rollback route, and revalidation plan before execution.
  - A change shall invalidate affected and transitive evidence, parity stamps, derivatives, indexes, and compatibility
    claims.
  - Detected deviation shall stop the affected route, preserve evidence, restore or re-plan from the last valid
    point, and revalidate the repaired scope.
  excludes: &id001
  - provider-specific authority unless this is an adapter
  - raw secrets or hidden credentials
  - completion claims without exact evidence
  - direct editing of generated derivatives
responsibilities:
- load identity, mission, scope, and current authority
- evaluate the invariant against the proposed action or claim
- block, permit, or require a governed decision
- record evidence and exact state
- invalidate and rerun when scope, source, policy, or hash changes
non_responsibilities: *id001
owned_concepts:
- ABS.CONCEPT.CHANGE_DEVIATION_RECOVERY
requirements:
- ABS.REQ.CHANGE_DEVIATION_RECOVERY.001
- ABS.REQ.CHANGE_DEVIATION_RECOVERY.002
- ABS.REQ.CHANGE_DEVIATION_RECOVERY.003
provided_interfaces:
