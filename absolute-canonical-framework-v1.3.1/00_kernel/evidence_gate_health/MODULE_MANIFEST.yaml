module_id: ABS.MODULE.KERNEL.EVIDENCE_GATES
name: Evidence, gates, health, and completion claims
version: 1.0.0
schema_version: 1.0.0
framework_release: 1.3.1
status: CANDIDATE
purpose: Evidence, gates, health, and completion claims
scope:
  includes:
  - PASS, COMPLETE, VERIFIED, HEALTHY, INSTALLED, DEPLOYED, and RELEASED claims shall cite current evidence bound
    to exact scope and candidate identity.
  - Canonical gate states shall be PASS, FAIL, BLOCKED, NOT_RUN, INCONCLUSIVE, STALE, INVALID_REPORT, or WAIVED_WITH_APPROVED_EXPIRY;
    legacy accepted-risk states migrate to PASS plus an explicit risk/waiver record.
  - Health shall distinguish healthy, degraded, partial, dependency-failed, unknown, untested, stale, misconfigured,
    and root-cause-unknown, and shall test the reporter itself.
  excludes: &id001
  - provider-specific authority unless this is an adapter
  - raw secrets or hidden credentials
  - completion claims without exact evidence
  - direct editing of generated derivatives
responsibilities:
- load identity, mission, scope, and current authority
- evaluate the invariant against the proposed action or claim
- block, permit, or require a governed decision
- record evidence and exact state
- invalidate and rerun when scope, source, policy, or hash changes
non_responsibilities: *id001
owned_concepts:
- ABS.CONCEPT.EVIDENCE_GATES_HEALTH
requirements:
- ABS.REQ.EVIDENCE_GATES_HEALTH.001
- ABS.REQ.EVIDENCE_GATES_HEALTH.002
- ABS.REQ.EVIDENCE_GATES_HEALTH.003
provided_interfaces:
- ABS.IFACE.EVIDENCE.RECORD
- ABS.IFACE.GATE.EVALUATE
consumed_interfaces:
- ABS.IFACE.SCHEMA.VALIDATE
- ABS.IFACE.TEST.EVALUATE
dependencies:
- ABS.MODULE.KERNEL.AUTHORITY_TRUTH
security_classification: INTERNAL
representations:
  narrative: REQUIRED
  blueprint: REQUIRED
  machine_spec: APPLICABLE
  visual_spec: APPLICABLE
  plain_english: REQUIRED
  quick_reference: REQUIRED
  tests: REQUIRED
applicability_reasons:
  machine_spec: States, requirements, evidence, and transitions require deterministic validation.
  visual_spec: What exact evidence supports this status and candidate hash?
canonical_paths:
  narrative: MODULE.md
  manifest: MODULE_MANIFEST.yaml
  requirements: requirements.json
  blueprint: blueprint/BLUEPRINT.md
  visual_source: blueprint/architecture.dot
  visual_output: blueprint/architecture.svg
  visual_manifest: blueprint/visual_manifest.json
  machine_schema: machine/contract.schema.json
  machine_policy: machine/policy.json
