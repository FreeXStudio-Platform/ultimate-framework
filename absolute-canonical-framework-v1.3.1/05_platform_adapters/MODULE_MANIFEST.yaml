purpose: ChatGPT/Codex, Claude Code, Cursor, local, and generic adapters
scope:
  includes:
  - ChatGPT/Codex, Claude Code, Cursor, local-agent, and generic-host adapters shall translate kernel contracts
    into host-specific files, hooks, permissions, context loading, and commands.
  - Adapters shall declare required capabilities, limitations, fallbacks, generated artifacts, approval boundaries,
    and non-authoritative surfaces.
  - Host-specific behavior shall not contaminate kernel invariants, and adapter compatibility shall be versioned
    and tested.
  excludes: &id001
  - provider-specific authority unless this is an adapter
  - raw secrets or hidden credentials
  - completion claims without exact evidence
  - direct editing of generated derivatives
responsibilities:
- preflight the actual host
- map canonical interfaces without changing semantics
- declare unsupported behavior and fallback
- configure least privilege and durable state
- run conformance, denial, outage, checkpoint, and resume tests
non_responsibilities: *id001
