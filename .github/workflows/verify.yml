name: verify
# Cost-controlled: runs on pull requests (not drafts), weekly, and on demand — never on push.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Graphviz (visual-parity check)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq graphviz
      - name: Install pinned validation dependencies
        run: python -m pip install -r absolute-canonical-framework-v1.3.1/04_enforcement/requirements-validation.txt
      - name: Deep verification
        working-directory: absolute-canonical-framework-v1.3.1
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tools/deep_verify.py
      - name: Evaluation harness
        working-directory: absolute-canonical-framework-v1.3.1
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python 09_tests_evals/run_all.py
