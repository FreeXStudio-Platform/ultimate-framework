module_id: ABS.MODULE.ENFORCEMENT.OBSERVABILITY
name: Observability, error taxonomy, incidents, and fault-seeking health
version: 1.0.0
schema_version: 1.0.0
framework_release: 1.3.1
status: CANDIDATE
purpose: Observability, error taxonomy, incidents, and fault-seeking health
scope:
  includes:
  - Observability shall expose state, health, errors, dependencies, freshness, and evidence without treating absence
    of alerts as health.
  - Errors and incidents shall use stable taxonomy, severity, scope, root-cause state, containment, recovery, evidence,
    and follow-up records.
  - Watchdogs and health reporters shall be tested with fault injection and shall fail truthfully when dependencies
    or their own reporting path are unavailable.
  excludes: &id001
  - provider-specific authority unless this is an adapter
  - raw secrets or hidden credentials
  - completion claims without exact evidence
  - direct editing of generated derivatives
responsibilities:
- load the versioned schema or policy
- validate structure, references, and authority
- run semantic, negative, adversarial, and failure checks
- preserve raw outcome and candidate hash
- block the governed event until violations are repaired
non_responsibilities: *id001
