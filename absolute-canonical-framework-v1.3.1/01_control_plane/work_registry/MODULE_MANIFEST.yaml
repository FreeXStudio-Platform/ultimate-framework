module_id: ABS.MODULE.CONTROL.WORK
name: Work packets, tasks, dependencies, and progress
version: 1.0.0
schema_version: 1.0.0
framework_release: 1.3.1
status: CANDIDATE
purpose: Work packets, tasks, dependencies, and progress
scope:
  includes:
  - Every work item shall have stable identity, bounded objective, parent goal, scope, dependencies, permissions,
    rollback, acceptance criteria, checks, evidence, owner, verifier, and truthful status.
  - Progress shall be computed only from weighted work that has passed its required verification; planned or implemented-only
    work shall not count as verified completion.
  - Duplicate, obsolete, rejected, blocked, deferred, superseded, and rolled-back work shall remain in history with
    explicit disposition.
  excludes: &id001
  - provider-specific authority unless this is an adapter
  - raw secrets or hidden credentials
  - completion claims without exact evidence
  - direct editing of generated derivatives
responsibilities:
- read the latest durable state and version
- validate bounded input, authority, permission, dependency, and rollback
- apply one atomic update
- record checks, findings, evidence, and limitations
- persist exact next action and reject stale writes
non_responsibilities: *id001
owned_concepts:
- ABS.CONCEPT.WORK_REGISTRY
requirements:
- ABS.REQ.WORK_REGISTRY.001
- ABS.REQ.WORK_REGISTRY.002
- ABS.REQ.WORK_REGISTRY.003
provided_interfaces:
- ABS.IFACE.WORK.PACKET
consumed_interfaces:
- ABS.IFACE.GOAL_LINK.VALIDATE
- ABS.IFACE.LIFECYCLE.TRANSITION
- ABS.IFACE.STATE.ATOMIC_UPDATE
dependencies:
- ABS.MODULE.KERNEL.AUTHORITY_TRUTH
- ABS.MODULE.KERNEL.CHANGE_RECOVERY
- ABS.MODULE.KERNEL.EVIDENCE_GATES
- ABS.MODULE.KERNEL.GOAL_LOCK
- ABS.MODULE.KERNEL.IDENTITY
- ABS.MODULE.KERNEL.LIFECYCLE
security_classification: INTERNAL
representations:
  narrative: REQUIRED
  blueprint: REQUIRED
  machine_spec: APPLICABLE
  visual_spec: APPLICABLE
  plain_english: REQUIRED
  quick_reference: REQUIRED
  tests: REQUIRED
applicability_reasons:
  machine_spec: States, requirements, evidence, and transitions require deterministic validation.
  visual_spec: What bounded outcome is being produced under which permissions?
canonical_paths:
