module_id: ABS.MODULE.KNOWLEDGE.RECONCILIATION
name: Source admission, lineage, no-loss reconciliation, and supersession
version: 1.0.0
schema_version: 1.0.0
framework_release: 1.3.1
status: CANDIDATE
purpose: Source admission, lineage, no-loss reconciliation, and supersession
scope:
  includes:
  - Source admission shall preserve raw bytes, hashes, collection boundaries, provenance, rights, confidentiality,
    extraction diagnostics, lineage, and explicit artifact disposition.
  - Reconciliation shall compare concepts and structured critical differences, preserve unique information, separate
    candidate discovery from replacement decisions, and build a shadow candidate before promotion.
  - Automatic high-impact replacement shall require complete provenance, rights, no unique knowledge loss, no unmapped
    links, no critical contradiction, calibrated precision, and rollback.
  excludes: &id001
  - provider-specific authority unless this is an adapter
  - raw secrets or hidden credentials
  - completion claims without exact evidence
  - direct editing of generated derivatives
responsibilities:
- identify the canonical scope and source evidence
- define or update the narrative meaning
- update applicable machine, blueprint, visual, integration, and test forms
- run parity, link, security, and evidence checks
- publish only governed derivatives and invalidate them on source change
non_responsibilities: *id001
