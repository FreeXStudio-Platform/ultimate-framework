module_id: ABS.MODULE.KERNEL.AUTHORITY_TRUTH
name: Scoped authority, truth states, and conflict handling
version: 1.0.0
schema_version: 1.0.0
framework_release: 1.3.1
status: CANDIDATE
purpose: Scoped authority, truth states, and conflict handling
scope:
  includes:
  - Authority shall be scoped by subject, artifact class, representation, version, lifecycle, and evidence; no file
    is universally authoritative.
  - Material claims shall use explicit truth states that distinguish verified fact, approved requirement/design,
    inference, plan, unknown, conflict, supersession, and rejection.
  - Equal-rank material conflicts shall be recorded and resolved by evidence-backed decision; vague compromise shall
    not replace contradictory requirements.
  excludes: &id001
  - provider-specific authority unless this is an adapter
  - raw secrets or hidden credentials
  - completion claims without exact evidence
  - direct editing of generated derivatives
responsibilities:
- load identity, mission, scope, and current authority
- evaluate the invariant against the proposed action or claim
- block, permit, or require a governed decision
- record evidence and exact state
- invalidate and rerun when scope, source, policy, or hash changes
non_responsibilities: *id001
owned_concepts:
- ABS.CONCEPT.AUTHORITY_TRUTH
requirements:
- ABS.REQ.AUTHORITY_TRUTH.001
- ABS.REQ.AUTHORITY_TRUTH.002
- ABS.REQ.AUTHORITY_TRUTH.003
provided_interfaces:
- ABS.IFACE.TRUTH.CLASSIFY
consumed_interfaces:
- ABS.IFACE.DECISION.RECORD
- ABS.IFACE.SOURCE.ADMIT
dependencies: []
security_classification: INTERNAL
representations:
  narrative: REQUIRED
  blueprint: REQUIRED
  machine_spec: APPLICABLE
  visual_spec: APPLICABLE
  plain_english: REQUIRED
  quick_reference: REQUIRED
  tests: REQUIRED
applicability_reasons:
  machine_spec: States, requirements, evidence, and transitions require deterministic validation.
  visual_spec: What is authoritative for this exact claim, scope, and version?
