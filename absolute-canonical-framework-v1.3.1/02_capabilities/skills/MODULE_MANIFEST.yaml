module_id: ABS.MODULE.CAPABILITY.SKILLS
name: Skills, subagents, and delegation contracts
version: 1.0.0
schema_version: 1.0.0
framework_release: 1.3.1
status: CANDIDATE
purpose: Skills, subagents, and delegation contracts
scope:
  includes:
  - A skill shall solve one bounded task class and declare triggers, non-triggers, prerequisites, inputs, workflow,
    stop conditions, outputs, permissions, validation, failures, fallback, and compatibility.
  - Delegation shall specify exact scope, governing IDs, allowed data, prohibited actions, output schema/location,
    evidence, cost, confidentiality, and return path.
  - Delegated self-report shall not be accepted without independent validation of artifacts, behavior, side effects,
    and evidence identities.
  excludes: &id001
  - provider-specific authority unless this is an adapter
  - raw secrets or hidden credentials
  - completion claims without exact evidence
  - direct editing of generated derivatives
responsibilities:
- derive the active packet's exact capability needs
- filter by trust, permission, data boundary, health, cost, and fallback
- activate the minimum sufficient set
- execute only the bounded operation
- record actual identity, revoke temporary grants, and review outcome
non_responsibilities: *id001
owned_concepts:
- ABS.CONCEPT.SKILLS_DELEGATION
requirements:
- ABS.REQ.SKILLS_DELEGATION.001
- ABS.REQ.SKILLS_DELEGATION.002
- ABS.REQ.SKILLS_DELEGATION.003
provided_interfaces:
