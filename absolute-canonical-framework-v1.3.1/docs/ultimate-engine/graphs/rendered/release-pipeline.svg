  <rect x="114.841" y="634.3" width="121.237" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="175.4595" y="652.75" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">7. Reproduce</text>
</g>
<g class="node" data-id="step8" data-label="8. Record" data-shape="rectangle">
  <rect x="125.95599999999999" y="719.1999999999999" width="99.007" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="175.4595" y="737.65" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">8. Record</text>
</g>
<g class="node" data-id="step9" data-label="9. Do not rename it" data-shape="rectangle">
  <rect x="102.61449999999999" y="804.0999999999999" width="145.69" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="175.4595" y="822.55" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">9. Do not rename it</text>
</g>
</svg>