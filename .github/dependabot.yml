version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /engine
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /engine/tools/visual-engine
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
