module_id: ABS.MODULE.ADDON.KNOWLEDGE
name: Optional RAG, vector search, and graph database
version: 1.0.0
schema_version: 1.0.0
framework_release: 1.3.1
status: CANDIDATE_OPTIONAL
purpose: Optional RAG, vector search, and graph database
scope:
  includes:
  - RAG, embeddings, vector indexes, and graph databases shall be optional and adopted only when measured scale,
    retrieval quality, latency, collaboration, or query complexity justifies them.
  - Retrieval infrastructure shall record source/version, chunking, embedding/model identity, access classification,
    tests, rebuild triggers, and provenance.
  - No derived index or embedding may outrank canonical source, bypass confidentiality, or survive invalidation
    after incompatible source/model changes.
  excludes: &id001
  - provider-specific authority unless this is an adapter
  - raw secrets or hidden credentials
  - completion claims without exact evidence
  - direct editing of generated derivatives
responsibilities:
- measure the problem with the add-on disabled
- define threshold, owner, cost, data, success, and exit
- pilot one bounded add-on
- compare measured benefit and risk
- retain, revise, or remove without losing canonical truth
non_responsibilities: *id001
