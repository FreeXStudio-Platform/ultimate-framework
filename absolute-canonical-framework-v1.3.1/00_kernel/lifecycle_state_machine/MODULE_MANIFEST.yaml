module_id: ABS.MODULE.KERNEL.LIFECYCLE
name: Lifecycle and two-pass completion
version: 1.0.0
schema_version: 1.0.0
framework_release: 1.3.1
status: CANDIDATE
purpose: Lifecycle and two-pass completion
scope:
  includes:
  - The framework kernel shall define a provider-independent lifecycle from intake through release and complete,
    including truthful blocked, failed, recovering, cancelled, stale, and inconclusive routes.
  - Pass 1 shall construct the complete bounded candidate; Pass 2 shall review the frozen whole, close gaps, optimize
    without reducing required behavior, and rerun affected checks.
  - Downstream profiles may refine gate granularity but shall map losslessly to the kernel lifecycle and may not
    bypass release or evidence gates.
  excludes: &id001
  - provider-specific authority unless this is an adapter
  - raw secrets or hidden credentials
  - completion claims without exact evidence
  - direct editing of generated derivatives
responsibilities:
- load identity, mission, scope, and current authority
- evaluate the invariant against the proposed action or claim
- block, permit, or require a governed decision
- record evidence and exact state
- invalidate and rerun when scope, source, policy, or hash changes
non_responsibilities: *id001
owned_concepts:
- ABS.CONCEPT.LIFECYCLE_TWO_PASS
requirements:
- ABS.REQ.LIFECYCLE_TWO_PASS.001
- ABS.REQ.LIFECYCLE_TWO_PASS.002
- ABS.REQ.LIFECYCLE_TWO_PASS.003
provided_interfaces:
- ABS.IFACE.LIFECYCLE.TRANSITION
consumed_interfaces: []
dependencies:
- ABS.MODULE.KERNEL.IDENTITY
security_classification: INTERNAL
representations:
  narrative: REQUIRED
  blueprint: REQUIRED
  machine_spec: APPLICABLE
  visual_spec: APPLICABLE
  plain_english: REQUIRED
  quick_reference: REQUIRED
  tests: REQUIRED
applicability_reasons:
  machine_spec: States, requirements, evidence, and transitions require deterministic validation.
  visual_spec: Which lifecycle state applies, and what permits promotion?
