module_id: ABS.MODULE.CAPABILITY.ROUTING
name: Provider-independent model and execution routing
version: 1.0.0
schema_version: 1.0.0
framework_release: 1.3.1
status: CANDIDATE
purpose: Provider-independent model and execution routing
scope:
  includes:
  - Kernel routing shall be based on capability, assurance, data sensitivity, irreversibility, context shape, deterministic
    opportunity, cost, capacity, and health rather than volatile model aliases.
  - Provider/model names, plans, prices, limits, and host behavior shall live in dated replaceable execution profiles
    and adapters.
  - High-risk synthesis and final verification shall use separated roles/contexts, and routing decisions shall record
    model/tool/version and evidence boundaries.
  excludes: &id001
  - provider-specific authority unless this is an adapter
  - raw secrets or hidden credentials
  - completion claims without exact evidence
  - direct editing of generated derivatives
responsibilities:
- derive the active packet's exact capability needs
- filter by trust, permission, data boundary, health, cost, and fallback
- activate the minimum sufficient set
- execute only the bounded operation
- record actual identity, revoke temporary grants, and review outcome
non_responsibilities: *id001
