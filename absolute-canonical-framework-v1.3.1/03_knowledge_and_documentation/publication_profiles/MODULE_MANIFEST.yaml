module_id: ABS.MODULE.KNOWLEDGE.PUBLICATION
name: Publication profiles, confidentiality, and claim sanitization
version: 1.0.0
schema_version: 1.0.0
framework_release: 1.3.1
status: CANDIDATE
purpose: Publication profiles, confidentiality, and claim sanitization
scope:
  includes:
  - Publication views shall derive from verified internal claims through audience/classification policy, sanitization,
    unsupported-claim checks, rights checks, secret scanning, freshness review, and required approval.
  - Required publication classes shall include internal exhaustive, restricted engineering, controlled enterprise,
    public commercial, engineering quick reference, plain English, and machine-consumable.
  - Every derivative claim shall retain source claim ID, version/hash, truth state, allowed audience, sanitization
    policy, approval, freshness, and invalidation trigger.
  excludes: &id001
  - provider-specific authority unless this is an adapter
  - raw secrets or hidden credentials
  - completion claims without exact evidence
  - direct editing of generated derivatives
responsibilities:
- identify the canonical scope and source evidence
- define or update the narrative meaning
- update applicable machine, blueprint, visual, integration, and test forms
- run parity, link, security, and evidence checks
- publish only governed derivatives and invalidate them on source change
non_responsibilities: *id001
owned_concepts:
- ABS.CONCEPT.PUBLICATION_CONFIDENTIALITY
requirements:
- ABS.REQ.PUBLICATION_CONFIDENTIALITY.001
- ABS.REQ.PUBLICATION_CONFIDENTIALITY.002
- ABS.REQ.PUBLICATION_CONFIDENTIALITY.003
provided_interfaces:
