module_id: ABS.PROFILE.PROJECT.AUDITHUNT
name: AuditHunt downstream installation profile only
version: 1.0.0
schema_version: 1.0.0
framework_release: 1.3.1
status: CANDIDATE
purpose: AuditHunt downstream installation profile only
scope:
  includes:
  - The framework release shall include an AuditHunt installation profile that maps reusable framework modules and
    adapters without importing AuditHunt implementation or history.
  - The profile shall not claim AuditHunt facts, modify AuditHunt, certify AuditHunt, or expose restricted AuditHunt
    evidence; all project-specific state remains externally supplied and verified.
  - Installation shall be reversible, profile-scoped, versioned, and validated against an explicitly provided AuditHunt
    baseline in a separate authorized program.
  excludes: &id001
  - provider-specific authority unless this is an adapter
  - raw secrets or hidden credentials
  - completion claims without exact evidence
  - direct editing of generated derivatives
responsibilities:
- classify project scale, domain, risk, and assurance
- select the smallest sufficient module composition
- apply only stricter policy overlays
- install in shadow mode with rollback
- validate project and adapter conformance before activation
non_responsibilities: *id001
