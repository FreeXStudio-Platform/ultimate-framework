module_id: ABS.MODULE.KERNEL.GOAL_LOCK
name: Goal lock and mission alignment
version: 1.0.0
schema_version: 1.0.0
framework_release: 1.3.1
status: CANDIDATE
purpose: Goal lock and mission alignment
scope:
  includes:
  - Every material action shall link to the active mission or to required support, risk reduction, verification,
    recovery, or maintenance; unrelated work is rejected or deferred.
  - The control plane shall record the parent goal for each work packet and reject material actions without a valid
    upward goal link.
  - Goal-lock checks shall be rerun when scope, project identity, mission, or authority changes.
  excludes: &id001
  - provider-specific authority unless this is an adapter
  - raw secrets or hidden credentials
  - completion claims without exact evidence
  - direct editing of generated derivatives
responsibilities:
- load identity, mission, scope, and current authority
- evaluate the invariant against the proposed action or claim
- block, permit, or require a governed decision
- record evidence and exact state
- invalidate and rerun when scope, source, policy, or hash changes
non_responsibilities: *id001
