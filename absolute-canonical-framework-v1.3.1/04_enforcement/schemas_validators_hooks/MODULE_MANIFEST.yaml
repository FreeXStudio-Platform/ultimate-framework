module_id: ABS.MODULE.ENFORCEMENT.CORE
name: Schemas, validators, hooks, policy, and deterministic enforcement
version: 1.0.0
schema_version: 1.0.0
framework_release: 1.3.1
status: CANDIDATE
purpose: Schemas, validators, hooks, policy, and deterministic enforcement
scope:
  includes:
  - Machine records shall use versioned schemas with explicit identifiers, enums, nullability, references, and compatibility
    rules.
  - Semantic validators shall reject false PASS, missing evidence, superseded authority, broken reciprocal links,
    unapproved destructive actions, restricted publication leakage, and manifest drift.
  - Must-run lifecycle rules shall use hooks, CI, policy, permissions, or runtime gates when supported, with pinned
    examples and fail-closed behavior for malformed input.
  excludes: &id001
  - provider-specific authority unless this is an adapter
  - raw secrets or hidden credentials
  - completion claims without exact evidence
  - direct editing of generated derivatives
responsibilities:
- load the versioned schema or policy
- validate structure, references, and authority
- run semantic, negative, adversarial, and failure checks
- preserve raw outcome and candidate hash
- block the governed event until violations are repaired
non_responsibilities: *id001
owned_concepts:
- ABS.CONCEPT.SCHEMAS_VALIDATORS_HOOKS
requirements:
- ABS.REQ.SCHEMAS_VALIDATORS_HOOKS.001
- ABS.REQ.SCHEMAS_VALIDATORS_HOOKS.002
- ABS.REQ.SCHEMAS_VALIDATORS_HOOKS.003
provided_interfaces:
- ABS.IFACE.SCHEMA.VALIDATE
consumed_interfaces:
- ABS.IFACE.RELEASE.ASSEMBLE
- ABS.IFACE.PARITY.VALIDATE
dependencies:
- ABS.MODULE.CAPABILITY.MANAGER
- ABS.MODULE.CONTROL.DECISIONS
- ABS.MODULE.CONTROL.RELEASE
- ABS.MODULE.CONTROL.STATE
- ABS.MODULE.CONTROL.WORK
- ABS.MODULE.KERNEL.AUTHORITY_TRUTH
- ABS.MODULE.KERNEL.CHANGE_RECOVERY
- ABS.MODULE.KERNEL.EVIDENCE_GATES
- ABS.MODULE.KERNEL.GOAL_LOCK
- ABS.MODULE.KERNEL.IDENTITY
- ABS.MODULE.KERNEL.LIFECYCLE
- ABS.MODULE.KNOWLEDGE.CANONICAL_MODULE
- ABS.MODULE.KNOWLEDGE.PARITY
security_classification: INTERNAL
representations:
  narrative: REQUIRED
  blueprint: REQUIRED
  machine_spec: APPLICABLE
  visual_spec: APPLICABLE
  plain_english: REQUIRED
  quick_reference: REQUIRED
  tests: REQUIRED
applicability_reasons:
  machine_spec: States, requirements, evidence, and transitions require deterministic validation.
  visual_spec: Which mandatory rule is mechanically enforced, and what does it reject?
canonical_paths:
