module_id: ABS.MODULE.CAPABILITY.MANAGER
name: Capability selection, health, permission, and fallback
version: 1.0.0
schema_version: 1.0.0
framework_release: 1.3.1
status: CANDIDATE
purpose: Capability selection, health, permission, and fallback
scope:
  includes:
  - Every executable or context-providing capability shall have a registry record covering identity, version, provenance,
    triggers, permissions, data scope, cost, health, fallback, security/license review, and lifecycle.
  - The active packet shall use the smallest sufficient set of healthy, authorized, attributable capabilities and
    shall prefer deterministic/local methods for mechanical work.
  - Unavailable, degraded, unauthenticated, or over-privileged capabilities shall not be represented as usable;
    write/external/destructive actions remain approval-bounded.
  excludes: &id001
  - provider-specific authority unless this is an adapter
  - raw secrets or hidden credentials
  - completion claims without exact evidence
  - direct editing of generated derivatives
responsibilities:
- derive the active packet's exact capability needs
- filter by trust, permission, data boundary, health, cost, and fallback
- activate the minimum sufficient set
- execute only the bounded operation
- record actual identity, revoke temporary grants, and review outcome
non_responsibilities: *id001
