module_id: ABS.MODULE.KNOWLEDGE.VISUALS
name: Visual semantics, routing, rendering, and accessibility
version: 1.0.0
schema_version: 1.0.0
framework_release: 1.3.1
status: CANDIDATE
purpose: Visual semantics, routing, rendering, and accessibility
scope:
  includes:
  - Every visual shall answer a defined reader question using a structured semantic source, declared data/evidence,
    visual grammar, semantic encodings, accessibility, renderer identity, and output manifest.
  - Visual routing shall select the simplest sufficient approved renderer; 3D, animation, and motion are allowed
    only when they materially improve understanding.
  - Generated visuals shall have editable semantic source and static accessible fallback, and rendering shall be
    validated for meaning, parity, labels, contrast, navigation, and export.
  excludes: &id001
  - provider-specific authority unless this is an adapter
  - raw secrets or hidden credentials
  - completion claims without exact evidence
  - direct editing of generated derivatives
responsibilities:
- identify the canonical scope and source evidence
- define or update the narrative meaning
- update applicable machine, blueprint, visual, integration, and test forms
- run parity, link, security, and evidence checks
- publish only governed derivatives and invalidate them on source change
non_responsibilities: *id001
owned_concepts:
- ABS.CONCEPT.VISUAL_RENDERING
requirements:
